spring.application.name=library
server.port=8080

# ---- Database: MySQL (WAMP, port 3306) ----
# Create the database and user first in phpMyAdmin.
spring.datasource.url=jdbc:mysql://localhost:3306/library_db
# Set DB_PASSWORD (and optionally DB_USERNAME) as environment variables.
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:}

# Create/update the tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
