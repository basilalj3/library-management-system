spring.application.name=library
server.port=8080

# ---- Database (H2, saved to the data/ folder inside the project) ----
spring.datasource.url=jdbc:h2:file:./data/library
spring.datasource.username=sa
spring.datasource.password=
# Create/update the tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/library , user: sa , no password)
spring.h2.console.enabled=true
